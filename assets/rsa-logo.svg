<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 112" role="img" aria-label="RSA — The Security Division of EMC">
  <!-- Bloco vermelho clássico da RSA Security -->
  <rect x="2" y="4" width="216" height="74" rx="2" fill="#be1e2d" />
  <rect x="6" y="8" width="208" height="66" rx="1" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="1.2" />
  <!-- Letras geométricas RSA -->
  <g fill="#ffffff">
    <!-- R -->
    <path d="M26 20 h28 c11 0 18 5.5 18 14.5 c0 6.5 -4 11.2 -10.5 13.2 l12.5 16.3 h-13.5 l-10.8 -14.8 h-11.7 v14.8 h-12 z M38 29.5 v11 h14.5 c4.5 0 7.2 -2.1 7.2 -5.5 c0 -3.4 -2.7 -5.5 -7.2 -5.5 z" />
    <!-- S -->
    <path d="M84 55.2 l7.2 -8.2 c4.8 4 11.2 6.2 17.8 6.2 c5.8 0 9.2 -2.1 9.2 -5.2 c0 -3.1 -2.8 -4.5 -11.8 -6.3 c-12.5 -2.5 -19.8 -6.2 -19.8 -15.4 c0 -8.8 7.6 -15.1 20.4 -15.1 c8.6 0 16.2 2.4 22.2 6.8 l-6.6 8.4 c-4.8 -3.4 -10.2 -5.2 -15.8 -5.2 c-5.2 0 -8.2 2 -8.2 4.8 c0 3 2.8 4.4 12 6.3 c12.4 2.5 19.6 6.4 19.6 15.5 c0 9.4 -8 15.6 -21.4 15.6 c-10.2 0 -19 -3 -24.8 -8.2 z" />
    <!-- A -->
    <path d="M161 20 h12.6 l21.4 44 h-12.8 l-4.2 -9.2 h-21.4 l-4.2 9.2 h-12.4 z M161.2 45.6 h14.2 l-7.1 -15.8 z" />
  </g>
  <!-- Selo SecurID à direita -->
  <g transform="translate(232, 12)">
    <rect x="0" y="0" width="124" height="58" rx="3" fill="#141920" stroke="#394553" stroke-width="1.4" />
    <text x="12" y="23" font-family="IBM Plex Mono, monospace" font-size="11" font-weight="600" fill="#e8edf1" letter-spacing="0.06em">SecurID®</text>
    <text x="12" y="40" font-family="IBM Plex Mono, monospace" font-size="8.5" fill="#f0a63c" letter-spacing="0.04em">2FA TOKEN SYSTEM</text>
    <circle cx="108" cy="20" r="5" fill="#63c98a" />
  </g>
  <!-- Subtítulo corporativo de 2011 -->
  <text x="4" y="98" font-family="IBM Plex Sans, sans-serif" font-size="12.5" font-weight="600" fill="#7a7468" letter-spacing="0.11em">THE SECURITY DIVISION OF EMC</text>
</svg>
